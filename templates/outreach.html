<!DOCTYPE html>
<html>
<head>
<title>Outreach Customers</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:30px;}
table{width:100%;border-collapse:collapse;}
th{background:#0284c7;padding:12px;}
td{padding:10px;border-bottom:1px solid #333;}
button{padding:10px 20px;background:#0284c7;color:white;border:none;border-radius:8px;}
</style>
</head>
<body>

<h1>📞 Outreach Customers</h1>

<a href="/">
<button>← Back to Dashboard</button>
</a>

<br><br>

<table>

<tr>
    <th>Customer ID</th>
    <th>Total Revenue</th>
    <th>Risk Level</th>
    <th>Offer</th>
</tr>

{% for customer in customers %}

<tr>
    <td>{{ customer.msisdn[:12] }}...</td>
    <td>{{ "%.2f"|format(customer.total_revenue) }}</td>
    <td>{{ customer.risk_level }}</td>
    <td>{{ customer.recommended_offer }}</td>
</tr>

{% endfor %}
</table>

</body>
</html>
